name: Render a CV
on:
  push:
    branches:
      - main
      - master
    paths:
      - "assets/rendercv/cv.yml"
      - "assets/rendercv/design.yaml"
      - "assets/rendercv/locale.yaml"
      - "assets/rendercv/settings.yaml"
  workflow_call:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rendercv:
    name: RenderCV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install RenderCV
        run: |
          pip install -r requirements.txt
      - name: RenderCV
        run: |
          # This is a dedicated RenderCV-schema-compliant copy of _data/cv.yml,
          # not _data/cv.yml itself — see assets/rendercv/cv.yml's header comment
          # for why the two can't be the same file.
          cv_file="assets/rendercv/cv.yml"
          if [ ! -f "$cv_file" ]; then
            echo "No $cv_file file found!"
            exit 1
          fi
          settings="assets/rendercv/settings.yaml"
          if [ ! -f "$settings" ]; then
            echo "Missing RenderCV config file!"
            exit 1
          fi
          rendercv render "$cv_file" --settings "$settings"
          rm assets/rendercv/rendercv_output/*.typ
      - name: Upload rendercv_output as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: RenderCV Output
          path: assets/rendercv/rendercv_output
      - name: Push the changes
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git add -A
          git commit -m "chore: render the latest CV"
          git push
