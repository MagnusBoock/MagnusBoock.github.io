# RenderCV-specific copy of _data/cv.yml's content, kept in sync by hand.
#
# Why this file exists instead of pointing RenderCV at _data/cv.yml directly:
# RenderCV's schema forbids extra fields at the top level of `cv:` (label,
# image, summary all fail validation), and its templater crashes outright
# (not just a validation warning) on any *unrecognized* list-valued field on
# an entry — which _data/cv.yml's Skills section relies on (`keywords:` is a
# list) for the website's own /cv/ page rendering via al_folio_cv. Since this
# starter is not allowed to own `_includes/` (enforced by
# test/style_contract.js) to add a compatibility override, the two consumers
# need their own copies: this file satisfies RenderCV's schema, _data/cv.yml
# (untouched) satisfies the website.
#
# If you update _data/cv.yml's content, mirror the changes here too.

